services:
  postgres:
    image: postgres:16-alpine
    container_name: breadify-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: breadify
      POSTGRES_PASSWORD: breadify_secret
      POSTGRES_DB: breadify
    ports:
      - "5432:5432"
    volumes:
      - breadify_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U breadify -d breadify"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  breadify_postgres_data:
